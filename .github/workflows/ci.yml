name: check

# Two files state the current version, and GUIDELINES says the trap out loud: **a
# release that misses one is not detectable by reading any single file.** That
# sentence describes a check rather than a checklist item, and the checklist
# lost twice to it — `README.md` sat two releases behind before anybody noticed.
#
# So this reads both and refuses a mismatch. It also refuses a Bundle in
# which no Document declares `matches: eager`: a specification is shipped
# inside the Bundle, and a reader left to guess where to start fails as
# quietly as a stale version does.
# A specification has nothing to build and nothing to test, and a check that
# exists to catch a silent failure should not be padded with checks that catch
# loud ones.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SPEC: luma-knowledge-format/specification/lkf.md
  BUNDLE: luma-knowledge-format/BUNDLE.md

jobs:
  version:
    name: The version agrees with itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Both places carry the same version
        run: |
          set -eu

          # Read only the frontmatter block. A key matched anywhere in the file
          # would sooner or later match an example in the prose, which is the
          # same class of quiet wrongness this workflow exists to prevent.
          fm() { awk -v k="^$2: *" 'NR==1&&/^---$/{f=1;next} f&&/^---$/{exit} f&&$0~k{sub(k,"");print;exit}' "$1"; }

          spec=$(fm "$SPEC" lkf_version)
          bundle=$(fm "$BUNDLE" version)

          printf '%-46s %s\n' "$SPEC"   "${spec:-(not found)}"
          printf '%-46s %s\n' "$BUNDLE" "${bundle:-(not found)}"

          # Absent is a failure, not a pass. A regex that stops matching after a
          # reformat would otherwise report agreement between two empty
          # strings, which is the shape of dishonesty this check exists to
          # prevent.
          for v in "$spec" "$bundle"; do
            [ -n "$v" ] || { echo; echo "A version could not be read — the file moved or the frontmatter was reformatted."; exit 1; }
          done

          if [ "$spec" != "$bundle" ]; then
            echo
            echo "These must agree. Each states something different that a stale number makes false:"
            echo "  $SPEC    what the specification is"
            echo "  $BUNDLE  which specification the built-in types render"
            echo
            echo "See docs/guidelines.md, 'Cutting a release'."
            exit 1
          fi

          echo
          echo "v$spec, consistently."

      - name: Something in the Bundle declares where reading starts
        run: |
          set -eu

          # The start-here claim travels on the Document it is about: a
          # Document that must be read first declares `matches: eager`. A
          # Bundle shipping a specification and no eager Document leaves a
          # reader to guess, which fails as quietly as a stale version does.
          if grep -rl -E '^matches: *eager *$' luma-knowledge-format --include='*.md' | grep -v '_types/'; then
            echo "An eager Document exists; a reader knows where to start."
          else
            echo "No Document in the Bundle declares 'matches: eager' — nothing says where reading starts."
            exit 1
          fi

      - name: A released version has a dated changelog section
        run: |
          set -eu
          spec=$(awk -v k='^lkf_version: *' 'NR==1&&/^---$/{f=1;next} f&&/^---$/{exit} f&&$0~k{sub(k,"");print;exit}' "$SPEC")

          # Only meaningful on `main`, where the version is by definition
          # released. On a draft branch the section is dated at release time —
          # step 2 — so demanding it earlier would fail every pull request.
          if [ "${GITHUB_REF_NAME:-}" != "main" ]; then
            echo "Not main — the changelog is dated when the draft ships."
            exit 0
          fi

          if grep -q "^## \[$spec\] — " CHANGELOG.md; then
            echo "CHANGELOG.md has a dated section for $spec."
          else
            echo "$SPEC says v$spec, and CHANGELOG.md has no dated '## [$spec] — …' section."
            echo "Either the release was never dated, or the version moved without one."
            exit 1
          fi
